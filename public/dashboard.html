<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My store — Haat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/haat.css">
</head>
<body>
  <div class="mobile-bar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Haat</a>
    <button id="menu-btn" type="button">Menu</button>
  </div>
  <div class="console">
    <aside class="side" aria-label="Dashboard">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Haat</a>
      <nav id="side-nav"></nav>
      <div class="who" id="who"></div>
    </aside>
    <main class="main" id="view" tabindex="-1"><p class="muted">Loading…</p></main>
  </div>

  <!-- Product add / edit -->
  <dialog id="product-dlg" aria-labelledby="product-dlg-title">
    <form id="product-form" novalidate>
      <div class="dlg-head"><h3 id="product-dlg-title">Add product</h3><button class="x" type="button" data-close aria-label="Close">×</button></div>
      <div class="dlg-body">
        <div class="form-error hidden" data-error role="alert"></div>
        <div class="field"><label for="p-name">Name</label><input id="p-name" name="name" data-field="Product name" required></div>
        <div class="field"><label for="p-desc">Description</label><textarea id="p-desc" name="description" data-field="Description"></textarea></div>
        <div class="row">
          <div class="field"><label for="p-price">Price (₹)</label><input id="p-price" name="price" type="number" min="0" step="0.01" data-field="Price" required></div>
          <div class="field"><label for="p-stock">Stock</label><input id="p-stock" name="stock" type="number" min="0" step="1" data-field="Stock" required></div>
        </div>
        <div class="field">
          <label for="p-img">Image URL <span class="muted small">(optional)</span></label>
          <input id="p-img" name="imageUrl" type="url" placeholder="https://…" data-field="Image URL">
          <div class="hint">Leave empty to use a coloured tile with the product's initials.</div>
        </div>
        <label class="small" id="publish-now-row" style="display:flex;gap:.5rem;align-items:center;font-weight:500">
          <input type="checkbox" name="publish" style="width:auto"> Publish straight away
        </label>
      </div>
      <div class="dlg-foot">
        <button class="btn ghost" type="button" data-close>Cancel</button>
        <button class="btn" type="submit" id="product-save">Save product</button>
      </div>
    </form>
  </dialog>

  <!-- Order detail -->
  <dialog id="order-dlg" aria-labelledby="order-dlg-title">
    <div class="dlg-head"><h3 id="order-dlg-title">Order</h3><button class="x" type="button" data-close aria-label="Close">×</button></div>
    <div class="dlg-body" id="order-body"></div>
  </dialog>

  <!-- Confirm -->
  <dialog id="confirm-dlg" aria-labelledby="confirm-title">
    <div class="dlg-head"><h3 id="confirm-title">Are you sure?</h3></div>
    <div class="dlg-body"><p id="confirm-text"></p></div>
    <div class="dlg-foot">
      <button class="btn ghost" type="button" data-close>Keep it</button>
      <button class="btn danger" type="button" id="confirm-ok">Delete</button>
    </div>
  </dialog>

  <script type="module" src="/assets/js/dashboard.js"></script>
</body>
</html>
